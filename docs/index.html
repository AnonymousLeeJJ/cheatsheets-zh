<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --accent: #2563eb; --accent-soft: #e8effd; --border: #e3e6ea; --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header.hero { text-align: center; padding: 60px 20px 36px; }
  header.hero h1 { font-size: 2.3rem; }
  header.hero p.sub { color: var(--muted); margin-top: 12px; font-size: 1.05rem; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: rgba(246,247,249,0.92);
             backdrop-filter: blur(8px); padding: 14px 0 12px; border-bottom: 1px solid var(--border); }
  .search { width: 100%; padding: 12px 18px; border: 1px solid var(--border); border-radius: 999px;
            font-size: 1rem; background: var(--card); outline: none; }
  .search:focus { border-color: var(--accent); }
  main { padding: 28px 0 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 22px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31,35,40,0.08); }
  .card .icon { font-size: 1.8rem; }
  .card h3 { margin: 8px 0 4px; font-size: 1.1rem; }
  .card p { color: var(--muted); font-size: 0.88rem; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  /* sheet view */
  #sheetView { display: none; }
  .sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .sheet-head .back { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
                      background: var(--card); cursor: pointer; font-size: 0.88rem; }
  .sheet-head .back:hover { border-color: var(--accent); color: var(--accent); }
  .sheet-body { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
                padding: 36px 44px; }
  .sheet-body h1 { font-size: 1.6rem; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
  .sheet-body h2 { font-size: 1.2rem; margin: 28px 0 10px; color: var(--accent); }
  .sheet-body table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.88rem; }
  .sheet-body th, .sheet-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .sheet-body th { background: var(--accent-soft); }
  .sheet-body tr:nth-child(even) td { background: #fafbfc; }
  .sheet-body code { background: #eff1f3; border-radius: 5px; padding: 2px 6px;
                     font-family: "SF Mono", Consolas, monospace; font-size: 0.85em; }
  .sheet-body pre { background: #1f2328; color: #e6edf3; border-radius: 10px; padding: 16px 20px;
                    overflow-x: auto; margin: 12px 0; }
  .sheet-body pre code { background: none; color: inherit; padding: 0; font-size: 0.85rem; line-height: 1.6; }
  .sheet-body ol, .sheet-body ul { margin: 8px 0 8px 24px; font-size: 0.92rem; }
  .sheet-body p { margin: 8px 0; }
  footer { text-align: center; padding: 36px 20px 48px; color: var(--muted); font-size: 0.88rem; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 700px) { .sheet-body { padding: 22px 18px; } }
</style>
</head>

<script id="sheets-data" type="application/json">[{"id": "docker", "name": "Docker", "icon": "🐳", "desc": "镜像容器 Compose 一把梭", "content": "# Docker 速查表\n\n## 镜像\n\n| 命令 | 说明 |\n| --- | --- |\n| `docker pull <镜像>:<标签>` | 拉取镜像 |\n| `docker images` | 查看本地镜像 |\n| `docker build -t <名字>:<标签> .` | 用当前目录 Dockerfile 构建 |\n| `docker rmi <镜像>` | 删除镜像 |\n| `docker image prune` | 清理悬空镜像 |\n| `docker save -o x.tar <镜像>` / `docker load -i x.tar` | 导出 / 导入镜像 |\n\n## 容器生命周期\n\n| 命令 | 说明 |\n| --- | --- |\n| `docker run -d --name web -p 8080:80 nginx` | 后台运行并映射端口 |\n| `docker run -it --rm ubuntu bash` | 交互式运行，退出即删 |\n| `docker ps` / `docker ps -a` | 运行中 / 全部容器 |\n| `docker stop <容器>` / `docker start <容器>` | 停止 / 启动 |\n| `docker restart <容器>` | 重启 |\n| `docker rm <容器>` | 删除容器 |\n| `docker rm -f $(docker ps -aq)` | 强制删除所有容器（慎用） |\n\n## 排查调试\n\n| 命令 | 说明 |\n| --- | --- |\n| `docker logs -f <容器>` | 跟踪日志 |\n| `docker logs --tail 100 <容器>` | 看最后 100 行 |\n| `docker exec -it <容器> bash` | 进入容器终端 |\n| `docker inspect <容器>` | 查看完整配置（IP、挂载等） |\n| `docker stats` | 实时资源占用 |\n| `docker cp <容器>:/路径 ./本地` | 容器与宿主互拷文件 |\n\n## 常用 run 参数\n\n| 参数 | 说明 |\n| --- | --- |\n| `-d` | 后台运行 |\n| `-p 宿主:容器` | 端口映射 |\n| `-v 宿主:容器` | 目录挂载 |\n| `-e KEY=VALUE` | 环境变量 |\n| `--name` | 容器命名 |\n| `--rm` | 退出后自动删除 |\n| `--restart unless-stopped` | 开机/异常自启 |\n| `--network <网络>` | 指定网络 |\n\n## Compose\n\n| 命令 | 说明 |\n| --- | --- |\n| `docker compose up -d` | 启动全部服务 |\n| `docker compose down` | 停止并删除 |\n| `docker compose logs -f <服务>` | 看某服务日志 |\n| `docker compose ps` | 查看服务状态 |\n| `docker compose up -d --build` | 重新构建并启动 |\n| `docker compose exec <服务> sh` | 进入服务容器 |\n\n## 清理\n\n| 命令 | 说明 |\n| --- | --- |\n| `docker system df` | 查看磁盘占用 |\n| `docker system prune` | 清理停止的容器、悬空镜像、未用网络 |\n| `docker system prune -a --volumes` | 深度清理（慎用，会删未使用镜像和数据卷） |\n"}, {"id": "git", "name": "Git", "icon": "🌿", "desc": "版本控制日常操作与后悔药", "content": "# Git 速查表\n\n## 初始与克隆\n\n| 命令 | 说明 |\n| --- | --- |\n| `git init -b main` | 初始化仓库，主分支命名为 main |\n| `git clone <url>` | 克隆远程仓库 |\n| `git clone --depth 1 <url>` | 浅克隆（只要最新提交，大仓库提速） |\n| `git config --global user.name \"名字\"` | 设置全局用户名 |\n| `git config --global user.email \"邮箱\"` | 设置全局邮箱 |\n\n## 日常三板斧\n\n| 命令 | 说明 |\n| --- | --- |\n| `git status` | 查看工作区状态 |\n| `git add <文件>` / `git add -A` | 暂存指定文件 / 全部改动 |\n| `git commit -m \"说明\"` | 提交 |\n| `git commit --amend` | 修改上一次提交（未推送前） |\n| `git push` / `git pull` | 推送 / 拉取 |\n\n## 分支操作\n\n| 命令 | 说明 |\n| --- | --- |\n| `git branch` | 查看本地分支 |\n| `git switch -c <分支>` | 创建并切换到新分支 |\n| `git switch <分支>` | 切换分支 |\n| `git merge <分支>` | 合并指定分支到当前分支 |\n| `git branch -d <分支>` | 删除已合并的分支 |\n| `git rebase main` | 把当前分支变基到 main 上 |\n\n## 后悔药\n\n| 命令 | 说明 |\n| --- | --- |\n| `git restore <文件>` | 丢弃工作区的修改 |\n| `git restore --staged <文件>` | 取消暂存（不丢改动） |\n| `git reset --soft HEAD~1` | 撤销上一次提交，改动回到暂存区 |\n| `git reset --hard HEAD~1` | 撤销上一次提交并**丢弃改动**（危险） |\n| `git reflog` | 查看操作历史，找回\"丢失\"的提交 |\n| `git revert <提交>` | 生成一个反向提交来撤销（安全，可推送） |\n\n## 暂存与现场保护\n\n| 命令 | 说明 |\n| --- | --- |\n| `git stash` | 暂存当前改动，干净切分支 |\n| `git stash pop` | 恢复最近一次暂存并删除记录 |\n| `git stash list` | 查看所有暂存 |\n\n## 查看与排查\n\n| 命令 | 说明 |\n| --- | --- |\n| `git log --oneline --graph --all` | 图形化查看分支历史 |\n| `git diff` / `git diff --staged` | 查看工作区 / 暂存区差异 |\n| `git blame <文件>` | 查看每行最后是谁改的 |\n| `git show <提交>` | 查看某次提交的内容 |\n| `git log -S \"关键字\"` | 搜索引入某关键字的提交 |\n\n## 远程相关\n\n| 命令 | 说明 |\n| --- | --- |\n| `git remote -v` | 查看远程地址 |\n| `git fetch` | 拉取远程更新但不合并 |\n| `git push -u origin <分支>` | 首次推送并关联上游 |\n| `git push --force-with-lease` | 安全强推（比 --force 安全） |\n"}, {"id": "http", "name": "HTTP", "icon": "🌐", "desc": "状态码/头部/curl 实战", "content": "# HTTP 速查表\n\n## 请求方法\n\n| 方法 | 语义 | 幂等 |\n| --- | --- | --- |\n| GET | 获取资源 | ✅ |\n| POST | 创建资源/提交数据 | ❌ |\n| PUT | 全量更新 | ✅ |\n| PATCH | 部分更新 | ❌ |\n| DELETE | 删除资源 | ✅ |\n| HEAD | 只取响应头 | ✅ |\n| OPTIONS | 预检/查询支持的方法 | ✅ |\n\n## 状态码速记\n\n**1xx 信息** ｜ **2xx 成功** ｜ **3xx 重定向** ｜ **4xx 你的锅** ｜ **5xx 服务器的锅**\n\n| 状态码 | 含义 | 常见场景 |\n| --- | --- | --- |\n| 200 | OK | 成功 |\n| 201 | Created | POST 创建成功 |\n| 204 | No Content | 删除成功，无返回体 |\n| 301 / 302 | 永久 / 临时重定向 | 域名迁移 / 登录跳转 |\n| 304 | Not Modified | 缓存有效，不用重新下载 |\n| 400 | Bad Request | 参数格式错误 |\n| 401 | Unauthorized | 没登录 / Token 失效 |\n| 403 | Forbidden | 登录了但没权限 |\n| 404 | Not Found | 资源不存在 |\n| 405 | Method Not Allowed | GET 接口用了 POST |\n| 409 | Conflict | 重复创建/状态冲突 |\n| 422 | Unprocessable Entity | 参数校验失败 |\n| 429 | Too Many Requests | 触发限流 |\n| 500 | Internal Server Error | 服务器崩了 |\n| 502 | Bad Gateway | 网关上游挂了 |\n| 503 | Service Unavailable | 服务过载/维护 |\n| 504 | Gateway Timeout | 上游超时 |\n\n## 常用请求头\n\n| 头部 | 作用 |\n| --- | --- |\n| `Authorization: Bearer <token>` | 身份认证 |\n| `Content-Type: application/json` | 请求体格式 |\n| `Accept: application/json` | 期望的响应格式 |\n| `User-Agent` | 客户端标识 |\n| `Cookie` | 携带 Cookie |\n| `If-None-Match: <etag>` | 协商缓存 |\n| `X-Requested-With: XMLHttpRequest` | 标识 Ajax 请求 |\n\n## 常用响应头\n\n| 头部 | 作用 |\n| --- | --- |\n| `Cache-Control: max-age=3600` | 缓存 1 小时 |\n| `ETag` | 资源指纹，配合 304 |\n| `Set-Cookie` | 种 Cookie |\n| `Location` | 重定向目标 |\n| `Access-Control-Allow-Origin` | CORS 允许的源 |\n| `Retry-After` | 限流后多久重试 |\n\n## curl 实战\n\n```bash\n# GET 带参数\ncurl \"https://api.example.com/users?page=2\"\n\n# POST JSON\ncurl -X POST https://api.example.com/users \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer TOKEN\" \\\n  -d '{\"name\":\"张三\",\"age\":25}'\n\n# 上传文件\ncurl -F \"file=@./a.png\" https://api.example.com/upload\n\n# 看完整请求响应（排错神器）\ncurl -v https://api.example.com\n\n# 只看状态码\ncurl -s -o /dev/null -w \"%{http_code}\\n\" https://api.example.com\n```\n\n## 缓存逻辑一句话\n\n强缓存（`Cache-Control`/`Expires`）不发请求 → 过期后发请求带 `If-None-Match` → 命中返回 304 → 没命中返回 200 新内容。\n\n## Cookie 关键属性\n\n`HttpOnly`（JS 读不到，防 XSS 偷）｜ `Secure`（仅 HTTPS）｜ `SameSite=Lax/Strict`（防 CSRF）\n"}, {"id": "linux", "name": "Linux", "icon": "🐧", "desc": "文件/进程/网络高频命令", "content": "# Linux 速查表\n\n## 文件与目录\n\n| 命令 | 说明 |\n| --- | --- |\n| `ls -lah` | 详细列表（含隐藏文件、人类可读大小） |\n| `cd -` | 回到上一个目录 |\n| `pwd` | 当前路径 |\n| `mkdir -p a/b/c` | 递归创建目录 |\n| `cp -r 源 目标` | 递归复制 |\n| `mv 源 目标` | 移动/重命名 |\n| `rm -rf <目录>` | 强制删除（⚠️ 不可恢复，慎用） |\n| `ln -s 目标 链接名` | 创建软链接 |\n| `touch <文件>` | 创建空文件/更新时间戳 |\n\n## 查找文件\n\n| 命令 | 说明 |\n| --- | --- |\n| `find . -name \"*.log\"` | 按文件名查找 |\n| `find . -type f -size +100M` | 找大于 100M 的文件 |\n| `find . -mtime -7` | 7 天内修改过的文件 |\n| `which <命令>` | 命令的安装路径 |\n| `grep -rn \"关键字\" .` | 递归搜索文件内容 |\n| `grep -rl \"关键字\" .` | 只列出匹配的文件名 |\n\n## 查看文件\n\n| 命令 | 说明 |\n| --- | --- |\n| `cat` / `less` | 全文查看 / 分页查看 |\n| `head -n 50 <文件>` | 前 50 行 |\n| `tail -n 50 <文件>` | 后 50 行 |\n| `tail -f <文件>` | 实时跟踪日志 |\n| `wc -l <文件>` | 统计行数 |\n| `du -sh <目录>` | 目录总大小 |\n| `df -h` | 磁盘剩余空间 |\n\n## 权限\n\n| 命令 | 说明 |\n| --- | --- |\n| `chmod +x <脚本>` | 加执行权限 |\n| `chmod 755 <文件>` | rwxr-xr-x |\n| `chmod -R 644 <目录>` | 递归设置 |\n| `chown 用户:组 <文件>` | 改所有者 |\n| `sudo !!` | 用 sudo 重跑上一条命令 |\n\n## 进程\n\n| 命令 | 说明 |\n| --- | --- |\n| `ps aux | grep <关键字>` | 查找进程 |\n| `top` / `htop` | 实时进程监控 |\n| `kill <PID>` | 结束进程 |\n| `kill -9 <PID>` | 强制结束（最后手段） |\n| `nohup <命令> &` | 后台运行，退出终端不中断 |\n| `jobs` / `fg %1` / `bg %1` | 查看 / 前台 / 后台任务 |\n\n## 网络\n\n| 命令 | 说明 |\n| --- | --- |\n| `curl -I <url>` | 只看响应头 |\n| `curl -o 文件 <url>` | 下载文件 |\n| `ping <主机>` | 测试连通性 |\n| `ss -tlnp` | 查看监听端口及进程 |\n| `scp 文件 用户@主机:路径` | 跨机器拷贝 |\n| `ssh 用户@主机` | 远程登录 |\n\n## 压缩解压\n\n| 命令 | 说明 |\n| --- | --- |\n| `tar -czvf a.tar.gz 目录` | 打包压缩 |\n| `tar -xzvf a.tar.gz` | 解压 |\n| `zip -r a.zip 目录` / `unzip a.zip` | zip 压缩 / 解压 |\n\n## 实用组合技\n\n```bash\n# 找出占用 8080 端口的进程并杀掉\nkill $(ss -tlnp | grep 8080 | grep -oP 'pid=\\K[0-9]+')\n\n# 统计当前目录各子目录大小并排序\ndu -sh */ | sort -rh\n\n# 批量把 .jpeg 重命名为 .jpg\nfor f in *.jpeg; do mv \"$f\" \"${f%.jpeg}.jpg\"; done\n```\n"}, {"id": "markdown", "name": "Markdown", "icon": "📝", "desc": "基础语法 + GitHub 扩展", "content": "# Markdown 速查表\n\n## 标题与文本\n\n```markdown\n# 一级标题\n## 二级标题\n### 三级标题\n\n**加粗**    *斜体*    ~~删除线~~    `行内代码`\n> 引用内容\n```\n\n## 列表\n\n```markdown\n- 无序列表项\n  - 缩进两个空格嵌套\n\n1. 有序列表\n2. 第二项\n\n- [ ] 未完成任务\n- [x] 已完成任务\n```\n\n## 链接与图片\n\n```markdown\n[链接文字](https://example.com)\n[锚点链接](#标题名)\n![图片描述](图片地址)\n\n<!-- 图片加宽度（HTML 写法，GitHub 支持） -->\n<img src=\"图片地址\" width=\"300\">\n```\n\n## 代码\n\n````markdown\n行内：`print(\"hi\")`\n\n代码块：\n```python\ndef hello():\n    return \"指定语言有语法高亮\"\n```\n\n对比块（diff 高亮）：\n```diff\n- 删除的行\n+ 新增的行\n```\n````\n\n## 表格\n\n```markdown\n| 左对齐 | 居中 | 右对齐 |\n| :--- | :---: | ---: |\n| a | b | c |\n```\n\n## 分割线与其他\n\n```markdown\n---\n***          （三种分割线写法）\n\n脚注：这是一个脚注[^1]\n[^1]: 脚注内容\n\n<!-- 注释，不会渲染 -->\n\n键盘按键：<kbd>Ctrl</kbd> + <kbd>C</kbd>\n```\n\n## GitHub 专属扩展\n\n```markdown\n@用户名              提及某人\n#123                引用 issue/PR\nSHA 值               自动链接到提交\n\n<details>\n<summary>点击展开折叠内容</summary>\n藏起来的内容\n</details>\n\n- [ ] 任务列表会自动统计进度（在 issue/PR 里）\n\n警告块（GitHub 新语法）：\n> [!NOTE]\n> 提示信息\n\n> [!WARNING]\n> 警告信息\n\n> [!IMPORTANT]\n> 重要信息\n```\n\n## README 排版技巧\n\n1. 标题层级从 `#` 开始依次递进，不要跳级\n2. 中英文之间加空格：`使用 Git 管理代码`\n3. 长文档开头放 `<div align=\"center\">` 居中的标题 + 徽章区\n4. 用 `<!-- toc -->` 风格的目录或手写锚点目录\n5. 徽章生成：https://shields.io\n"}, {"id": "npm", "name": "npm", "icon": "📦", "desc": "依赖管理/脚本/发布", "content": "# npm 速查表\n\n## 安装与依赖\n\n| 命令 | 说明 |\n| --- | --- |\n| `npm init -y` | 快速生成 package.json |\n| `npm install <包>` / `npm i <包>` | 安装到 dependencies |\n| `npm i -D <包>` | 安装到 devDependencies（开发依赖） |\n| `npm i <包>@1.2.3` | 安装指定版本 |\n| `npm i` | 按 package.json 安装全部依赖 |\n| `npm ci` | 严格按 lock 文件安装（CI 环境推荐） |\n| `npm uninstall <包>` | 卸载 |\n| `npm update <包>` | 更新到允许的最新版 |\n\n## 版本号规则（SemVer）\n\n`主版本.次版本.修订号` → `^1.2.3` 允许次版本升级（默认）｜ `~1.2.3` 只允许修订升级 ｜ `1.2.3` 锁死\n\n## 脚本\n\n| 命令 | 说明 |\n| --- | --- |\n| `npm run` | 列出所有可用脚本 |\n| `npm run <脚本名>` | 执行 scripts 里的命令 |\n| `npm start` / `npm test` | 特殊脚本可省略 run |\n\n```json\n{\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build\",\n    \"preview\": \"vite preview\"\n  }\n}\n```\n\n## 查看信息\n\n| 命令 | 说明 |\n| --- | --- |\n| `npm ls <包>` | 查看安装版本和依赖树 |\n| `npm outdated` | 查看哪些包有新版本 |\n| `npm view <包> versions` | 查看该包的所有发布版本 |\n| `npm view <包>` | 查看包详情（描述、仓库地址等） |\n| `npm audit` | 安全漏洞扫描 |\n| `npm audit fix` | 自动修复可修复的漏洞 |\n\n## 全局与缓存\n\n| 命令 | 说明 |\n| --- | --- |\n| `npm i -g <包>` | 全局安装（CLI 工具） |\n| `npm ls -g --depth=0` | 查看全局安装的包 |\n| `npm root -g` | 全局安装路径 |\n| `npm cache clean --force` | 清缓存（玄学问题先试试） |\n\n## 发布自己的包\n\n```bash\nnpm login                # 登录\nnpm version patch        # 版本号 +0.0.1 并打 git tag\nnpm publish              # 发布\nnpm publish --tag beta   # 发 beta 版（不覆盖 latest）\n```\n\n## npx（不安装直接跑）\n\n| 命令 | 说明 |\n| --- | --- |\n| `npx <包>` | 临时下载并执行，用完即弃 |\n| `npx create-react-app my-app` | 脚手架经典用法 |\n| `npx cowsay hi` | 快速试用一个包 |\n\n## 国内加速\n\n```bash\n# 切换淘宝镜像\nnpm config set registry https://registry.npmmirror.com\n\n# 单次使用\nnpm i --registry=https://registry.npmmirror.com\n\n# 切回官方源\nnpm config set registry https://registry.npmjs.org\n```\n\n## pnpm / yarn 对照\n\n| 操作 | npm | pnpm | yarn |\n| --- | --- | --- | --- |\n| 安装全部 | `npm i` | `pnpm i` | `yarn` |\n| 加依赖 | `npm i x` | `pnpm add x` | `yarn add x` |\n| 加开发依赖 | `npm i -D x` | `pnpm add -D x` | `yarn add -D x` |\n| 卸载 | `npm un x` | `pnpm rm x` | `yarn remove x` |\n| 跑脚本 | `npm run dev` | `pnpm dev` | `yarn dev` |\n"}, {"id": "python", "name": "Python", "icon": "🐍", "desc": "常用语法与现代写法", "content": "# Python 速查表\n\n## 数据类型与常用操作\n\n```python\n# 字符串\ns = \"hello world\"\ns.upper(); s.split(); s.replace(\"o\", \"0\"); s.strip()\ns.startswith(\"he\"); \"world\" in s\nf\"格式化 {name}，保留两位 {pi:.2f}\"\n\n# 列表\nlst = [1, 2, 3]\nlst.append(4); lst.insert(0, 0); lst.pop(); lst.remove(2)\nlst.sort(reverse=True); sorted(lst); lst[::-1]  # 反转\nlst[1:3]  # 切片\n\n# 字典\nd = {\"a\": 1}\nd.get(\"b\", 0)          # 安全的取值\nd.setdefault(\"c\", [])  # 没有则设默认值\nd.keys(); d.values(); d.items()\n{a: b for a, b in d.items() if b}  # 字典推导式\n\n# 集合（去重/交并差）\na, b = {1, 2, 3}, {2, 3, 4}\na & b   # {2, 3} 交集\na | b   # {1,2,3,4} 并集\na - b   # {1} 差集\n```\n\n## 推导式与常用内建\n\n```python\n[x*2 for x in range(10) if x % 2 == 0]      # 列表推导\nenumerate(lst)                                # 带索引遍历\nzip(a, b)                                     # 并行遍历\nany(lst); all(lst)                            # 任一/全部\nmax(lst, key=lambda x: x.age)                 # 按属性取最大\nsorted(lst, key=lambda x: -x.score)\n```\n\n## 文件与 JSON\n\n```python\n# 文件（with 自动关闭）\nwith open(\"a.txt\", encoding=\"utf-8\") as f:\n    content = f.read()\n\n# JSON\nimport json\ndata = json.loads('{\"a\": 1}')           # 字符串 → 对象\ntext = json.dumps(data, ensure_ascii=False, indent=2)  # 对象 → 字符串\nwith open(\"data.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False, indent=2)\n```\n\n## 异常处理\n\n```python\ntry:\n    result = 10 / x\nexcept ZeroDivisionError as e:\n    print(\"除零了\", e)\nexcept (ValueError, TypeError):\n    pass\nelse:\n    print(\"没异常才执行\")\nfinally:\n    print(\"一定执行\")\n\nraise ValueError(\"自定义错误信息\")\n```\n\n## 类\n\n```python\nclass User:\n    count = 0                      # 类属性\n\n    def __init__(self, name):\n        self.name = name           # 实例属性\n        User.count += 1\n\n    def __repr__(self):            # print 时显示\n        return f\"User({self.name})\"\n\n    @property\n    def upper_name(self):          # 像属性一样调用\n        return self.name.upper()\n\n    @staticmethod\n    def is_valid(name):\n        return len(name) > 0\n```\n\n## 实用标准库\n\n```python\nfrom pathlib import Path\np = Path(\"a/b.txt\")\np.exists(); p.read_text(encoding=\"utf-8\"); p.parent; p.suffix\n\nfrom collections import Counter, defaultdict\nCounter(\"hello\")                   # 字符计数\ndd = defaultdict(list)             # 不怕 KeyError\n\nfrom datetime import datetime, timedelta\ndatetime.now() + timedelta(days=7)\ndatetime.now().strftime(\"%Y-%m-%d %H:%M\")\n\nimport itertools\nitertools.chain([1,2],[3,4]); itertools.combinations([1,2,3], 2)\n```\n\n## 环境管理\n\n```bash\npython -m venv .venv            # 建虚拟环境\n.venv\\Scripts\\activate          # Windows 激活\nsource .venv/bin/activate       # Mac/Linux 激活\npip install -r requirements.txt # 装依赖\npip freeze > requirements.txt   # 导出依赖\n```\n\n## 现代写法速查\n\n```python\n# 海象运算符\nif (n := len(data)) > 10:\n    print(n)\n\n# 类型标注\ndef greet(name: str, age: int = 18) -> str:\n    return f\"{name} {age}\"\n\n# match 语句（3.10+）\nmatch status:\n    case 200: return \"OK\"\n    case 404: return \"没找到\"\n    case _:   return \"其他\"\n```\n"}, {"id": "regex", "name": "正则表达式", "icon": "🔣", "desc": "语法速查 + 实战模板", "content": "# 正则表达式速查表\n\n## 字符类\n\n| 语法 | 说明 | 示例 |\n| --- | --- | --- |\n| `.` | 任意字符（除换行） | `a.c` 匹配 abc、a1c |\n| `\\d` `\\D` | 数字 / 非数字 | `\\d{3}` 匹配 123 |\n| `\\w` `\\W` | 单词字符（字母数字下划线）/ 非 | |\n| `\\s` `\\S` | 空白 / 非空白 | |\n| `[abc]` | a/b/c 之一 | |\n| `[^abc]` | 非 a/b/c | |\n| `[a-z]` `[0-9]` | 范围 | |\n\n## 量词\n\n| 语法 | 说明 |\n| --- | --- |\n| `*` | 0 次或多次 |\n| `+` | 1 次或多次 |\n| `?` | 0 次或 1 次（也用于非贪婪） |\n| `{n}` | 恰好 n 次 |\n| `{n,}` | 至少 n 次 |\n| `{n,m}` | n 到 m 次 |\n| `*?` `+?` | 非贪婪模式（能少则少） |\n\n## 位置\n\n| 语法 | 说明 |\n| --- | --- |\n| `^` | 行首 |\n| `$` | 行尾 |\n| `\\b` | 单词边界（`\\bcat\\b` 不匹配 category） |\n\n## 分组与逻辑\n\n| 语法 | 说明 |\n| --- | --- |\n| `(abc)` | 捕获分组（可用 `\\1` 引用） |\n| `(?:abc)` | 非捕获分组 |\n| `a|b` | 或 |\n| `(?=...)` | 正向先行断言 |\n| `(?!...)` | 反向先行断言 |\n| `(?<=...)` | 正向后行断言（部分引擎支持） |\n\n## 常用实战模板\n\n```regex\n手机号（中国）        ^1[3-9]\\d{9}$\n邮箱（简化版）        ^[\\w.+-]+@[\\w-]+\\.[\\w.]+$\nURL（简化版）         ^https?://[\\w.-]+(:\\d+)?(/\\S*)?$\nIPv4                 ^(\\d{1,3}\\.){3}\\d{1,3}$\n日期 YYYY-MM-DD      ^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$\n强密码（8位+含大小写数字）  ^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}$\n提取引号内容          \"([^\"]*)\"\n匹配 HTML 标签        <(\\w+)[^>]*>.*?</\\1>\n中文字符             [一-龥]\n行尾空格             \\s+$\n```\n\n## 经典案例拆解\n\n**匹配 18 位身份证号（简化）：**\n```\n^\\d{17}[\\dXx]$\n```\n\n**提取 Markdown 图片地址 `![alt](url)`：**\n```\n!\\[([^\\]]*)\\]\\(([^)]+)\\)\n```\n\n**千分位数字 1,234,567：**\n```\n^\\d{1,3}(,\\d{3})*$\n```\n\n## 常见坑\n\n1. **贪婪陷阱**：`<.+>` 匹配整行 HTML，应该用 `<[^>]+>` 或 `<.+?>`\n2. **`.` 不跨行**：想跨行匹配用 `[\\s\\S]` 或开 DOTALL 模式\n3. **转义层级**：字符串里写正则时 `\\d` 要写成 `\\\\d`\n4. **|^ 空匹配**：`(a|)` 能匹配空串，分支顺序有影响\n"}, {"id": "sql", "name": "SQL", "icon": "🗄️", "desc": "查询/连接/窗口函数/优化", "content": "# SQL 速查表\n\n## 查询\n\n```sql\n-- 基础查询\nSELECT id, name FROM users WHERE age > 18 ORDER BY id DESC LIMIT 10;\n\n-- 去重\nSELECT DISTINCT city FROM users;\n\n-- 模糊匹配：% 任意长度，_ 单个字符\nSELECT * FROM users WHERE name LIKE '张%';\n\n-- 范围与集合\nSELECT * FROM orders WHERE amount BETWEEN 100 AND 500;\nSELECT * FROM users WHERE city IN ('北京', '上海');\n\n-- 空值判断（不能用 = NULL）\nSELECT * FROM users WHERE phone IS NULL;\n```\n\n## 聚合与分组\n\n```sql\nSELECT city, COUNT(*) AS cnt, AVG(age) AS avg_age\nFROM users\nGROUP BY city\nHAVING COUNT(*) > 100          -- 分组后的过滤用 HAVING\nORDER BY cnt DESC;\n```\n\n| 聚合函数 | 说明 |\n| --- | --- |\n| `COUNT(*)` / `COUNT(列)` | 行数 / 非空数 |\n| `SUM` `AVG` `MAX` `MIN` | 求和/平均/最大/最小 |\n| `GROUP_CONCAT(列)` | 拼接分组内值（MySQL） |\n\n## 多表连接\n\n```sql\n-- INNER JOIN：两边都有才返回\nSELECT o.id, u.name FROM orders o JOIN users u ON o.user_id = u.id;\n\n-- LEFT JOIN：左表全保留，右表没有补 NULL\nSELECT u.name, COUNT(o.id) FROM users u\nLEFT JOIN orders o ON o.user_id = u.id GROUP BY u.id;\n\n-- 找「没有订单的用户」（经典反连接）\nSELECT u.* FROM users u LEFT JOIN orders o ON o.user_id = u.id\nWHERE o.id IS NULL;\n```\n\n## 增删改\n\n```sql\nINSERT INTO users (name, age) VALUES ('张三', 25), ('李四', 30);\n\nUPDATE users SET age = age + 1 WHERE id = 1;   -- ⚠️ 别忘 WHERE\n\nDELETE FROM users WHERE id = 1;                -- ⚠️ 别忘 WHERE\n```\n\n## 常用函数\n\n| 类型 | 函数 |\n| --- | --- |\n| 字符串 | `CONCAT(a,b)`、`SUBSTRING(s,1,3)`、`LENGTH`、`UPPER`、`TRIM`、`REPLACE` |\n| 日期 | `NOW()`、`CURDATE()`、`DATE_FORMAT(d,'%Y-%m')`、`DATEDIFF(a,b)` |\n| 条件 | `IFNULL(x,0)`、`COALESCE(a,b,0)`、`CASE WHEN ... THEN ... END` |\n\n## 窗口函数（分析利器）\n\n```sql\n-- 每个城市年龄排名\nSELECT name, city, age,\n  ROW_NUMBER() OVER (PARTITION BY city ORDER BY age DESC) AS rn\nFROM users;\n\n-- 累计求和\nSELECT date, amount,\n  SUM(amount) OVER (ORDER BY date) AS running_total\nFROM sales;\n```\n\n## 索引与优化要点\n\n1. `WHERE`、`JOIN`、`ORDER BY` 涉及的列优先建索引\n2. 联合索引遵循**最左前缀**：索引 `(a,b,c)` 能服务 `a`、`a,b`、`a,b,c`，不能服务 `b,c`\n3. 避免 `SELECT *`，只取需要的列\n4. 避免对索引列做函数/运算：`WHERE DATE(create_time)='2026-01-01'` 会失效，改范围查询\n5. `LIKE '%abc'` 前导通配符无法走索引\n6. 慢查询先看 `EXPLAIN`：关注 `type`（至少 range）、`rows`、`key`\n\n## 事务\n\n```sql\nSTART TRANSACTION;\nUPDATE account SET balance = balance - 100 WHERE id = 1;\nUPDATE account SET balance = balance + 100 WHERE id = 2;\nCOMMIT;   -- 出错就 ROLLBACK;\n```\n\n隔离级别速记：读未提交 < 读已提交 < **可重复读（MySQL 默认）** < 串行化，级别越高越慢但越安全。\n"}, {"id": "vim", "name": "Vim", "icon": "⌨️", "desc": "从入门到退出（真的）", "content": "# Vim 速查表\n\n## 模式\n\n| 按键 | 说明 |\n| --- | --- |\n| `i` / `a` / `o` | 光标前 / 后 / 下一行 进入插入模式 |\n| `Esc` | 回到普通模式 |\n| `v` / `V` / `Ctrl+v` | 字符 / 行 / 块 可视模式 |\n| `:` | 命令模式 |\n\n## 移动\n\n| 按键 | 说明 |\n| --- | --- |\n| `h j k l` | 左 下 上 右 |\n| `w` / `b` | 下一个 / 上一个单词 |\n| `0` / `^` / `$` | 行首 / 第一个非空字符 / 行尾 |\n| `gg` / `G` | 文件头 / 文件尾 |\n| `:{行号}` | 跳到指定行 |\n| `%` | 匹配括号间跳转 |\n| `Ctrl+d` / `Ctrl+u` | 向下 / 向上半屏 |\n| `*` / `#` | 向下 / 向上搜索光标下单词 |\n\n## 编辑\n\n| 按键 | 说明 |\n| --- | --- |\n| `x` | 删除字符 |\n| `dd` | 删除（剪切）整行 |\n| `yy` | 复制整行 |\n| `p` / `P` | 粘贴到后 / 前 |\n| `u` / `Ctrl+r` | 撤销 / 重做 |\n| `cw` | 修改一个单词 |\n| `ci\"` | 修改引号内内容（同理 `ci(``ci{`） |\n| `r<字符>` | 替换单个字符 |\n| `J` | 合并下一行到当前行 |\n| `>>` / `<<` | 缩进 / 反缩进 |\n| `.` | 重复上一次修改（神技） |\n\n## 组合公式：操作 + 范围\n\n`d`（删）`y`（复制）`c`（改）+ 移动范围：\n\n| 命令 | 效果 |\n| --- | --- |\n| `dw` | 删到单词尾 |\n| `d$` | 删到行尾 |\n| `dgg` | 删到文件头 |\n| `y3j` | 复制向下 3 行 |\n| `ct)` | 改到 ) 之前 |\n\n## 搜索替换\n\n| 命令 | 说明 |\n| --- | --- |\n| `/关键字` 然后 `n`/`N` | 向下搜索，下一个/上一个 |\n| `:%s/旧/新/g` | 全文替换 |\n| `:%s/旧/新/gc` | 全文替换并逐个确认 |\n| `:10,20s/旧/新/g` | 只替换 10-20 行 |\n\n## 多文件与分屏\n\n| 命令 | 说明 |\n| --- | --- |\n| `:sp` / `:vsp` | 水平 / 垂直分屏 |\n| `Ctrl+w 方向键` | 切换窗口 |\n| `:bn` / `:bp` | 下一个 / 上一个 buffer |\n| `:e 文件` | 打开文件 |\n\n## 保存退出（经典难题）\n\n| 命令 | 说明 |\n| --- | --- |\n| `:w` | 保存 |\n| `:q` | 退出 |\n| `:wq` / `ZZ` | 保存并退出 |\n| `:q!` / `ZQ` | 不保存强制退出 |\n| `:w !sudo tee %` | 忘记 sudo 打开时的保存大法 |\n"}, {"id": "vscode", "name": "VS Code", "icon": "💡", "desc": "快捷键与必装插件", "content": "# VS Code 快捷键速查表（Windows / Mac）\n\n> Mac 用户把 `Ctrl` 换成 `Cmd`，`Alt` 换成 `Option`\n\n## 高频必备\n\n| 快捷键 | 功能 |\n| --- | --- |\n| `Ctrl+P` | 快速打开文件（神器） |\n| `Ctrl+Shift+P` | 命令面板（万能入口） |\n| `Ctrl+`` ` | 打开/关闭终端 |\n| `Ctrl+B` | 开关侧边栏 |\n| `Ctrl+Shift+F` | 全局搜索 |\n| `Ctrl+H` | 当前文件替换 |\n| `Ctrl+/` | 注释/取消注释 |\n| `Ctrl+S` / `Ctrl+K S` | 保存 / 全部保存 |\n\n## 光标与选择（效率核心）\n\n| 快捷键 | 功能 |\n| --- | --- |\n| `Alt+点击` | 添加多个光标 |\n| `Ctrl+D` | 选中当前单词，再按选中下一个相同词（批量改名神器） |\n| `Ctrl+Shift+L` | 选中所有相同词 |\n| `Shift+Alt+↓` | 向下复制一行 |\n| `Alt+↑/↓` | 整行上移/下移 |\n| `Ctrl+Shift+K` | 删除整行 |\n| `Ctrl+L` | 选中整行 |\n| `Ctrl+Enter` | 下方插入新行 |\n| `Ctrl+Shift+Enter` | 上方插入新行 |\n\n## 代码导航\n\n| 快捷键 | 功能 |\n| --- | --- |\n| `F12` | 跳转到定义 |\n| `Alt+F12` | 速览定义（不跳转） |\n| `Shift+F12` | 查看所有引用 |\n| `F2` | 重命名符号（全项目安全改名） |\n| `Ctrl+T` | 按符号搜索（函数/类） |\n| `Ctrl+G` | 跳到指定行 |\n| `Alt+←/→` | 前进/后退（浏览历史） |\n| `Ctrl+Tab` | 在最近文件间切换 |\n\n## 编辑增强\n\n| 快捷键 | 功能 |\n| --- | --- |\n| `Ctrl+Space` | 触发补全 |\n| `Ctrl+.` | 快速修复（自动 import 等） |\n| `Shift+Alt+F` | 格式化文档 |\n| `Ctrl+K Ctrl+X` | 删除行尾空格 |\n| `Ctrl+]` / `Ctrl+[` | 缩进/反缩进 |\n| `Ctrl+Shift+\\` | 跳到匹配括号 |\n| `Ctrl+K Ctrl+0` | 折叠全部 |\n| `Ctrl+K Ctrl+J` | 展开全部 |\n\n## 分屏与窗口\n\n| 快捷键 | 功能 |\n| --- | --- |\n| `Ctrl+\\` | 左右分屏 |\n| `Ctrl+1/2/3` | 聚焦第 N 个编辑组 |\n| `Ctrl+W` | 关闭当前标签 |\n| `Ctrl+Shift+T` | 重开刚关闭的标签 |\n| `Ctrl+K Z` | 禅模式（专注写码） |\n\n## 值得装的通用插件\n\n- **Error Lens** — 行内直接显示报错，不用 hovering\n- **GitLens** — 每行代码显示谁改的、什么时候\n- **Path Intellisense** — 路径自动补全\n- **Auto Rename Tag** — 改开标签自动改闭标签（前端）\n- **Todo Tree** — 汇总所有 TODO 注释\n"}]</script>
<script>
const SHEETS = JSON.parse(document.getElementById('sheets-data').textContent);
const grid = document.getElementById('grid');
const homeView = document.getElementById('homeView');
const sheetView = document.getElementById('sheetView');
const sheetBody = document.getElementById('sheetBody');

function renderGrid(q) {
  const kw = (q || '').toLowerCase();
  const list = SHEETS.filter(s => !kw ||
    (s.name + s.desc + s.content).toLowerCase().includes(kw));
  grid.innerHTML = list.length ? list.map(s => `
    <div class="card" data-id="${s.id}">
      <div class="icon">${s.icon}</div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
    </div>`).join('')
    : '<div class="empty">没有找到相关内容 🧐</div>';
  grid.querySelectorAll('.card').forEach(el =>
    el.addEventListener('click', () => openSheet(el.dataset.id)));
}

function openSheet(id) {
  const s = SHEETS.find(x => x.id === id);
  if (!s) return;
  sheetBody.innerHTML = marked.parse(s.content);
  homeView.style.display = 'none';
  sheetView.style.display = 'block';
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + id);
}

document.getElementById('backBtn').addEventListener('click', () => {
  sheetView.style.display = 'none';
  homeView.style.display = 'block';
  history.replaceState(null, '', location.pathname);
});
document.getElementById('search').addEventListener('input', e => {
  sheetView.style.display = 'none';
  homeView.style.display = 'block';
  renderGrid(e.target.value.trim());
});

renderGrid('');
if (location.hash) openSheet(location.hash.slice(1));
</script>
